name: Rulla ut till Kubernetes
description: Sätter imagen, applicerar manifesten, väntar på utrullningen och rullar tillbaka om den faller.

inputs:
  miljo:
    description: "Mapp under k8s/, till exempel kind eller moln"
    required: true
  image:
    description: "Hela imagenamnet med tagg"
    required: true

runs:
  using: composite
  steps:
    - name: Sätt imagen
      shell: bash
      working-directory: k8s/${{ inputs.miljo }}
      env:
        IMAGE: ${{ inputs.image }}
      run: kustomize edit set image "${IMAGE%:*}=$IMAGE"

    - name: Applicera manifesten
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: |
        kubectl apply -k "k8s/${{ inputs.miljo }}"
        kubectl annotate deployment/saldes --overwrite kubernetes.io/change-cause="deploy ${IMAGE##*:}"

    - name: Vänta på utrullningen
      shell: bash
      run: |
        if ! kubectl rollout status deployment/saldes --timeout=180s; then
          echo "::error::Utrullningen blev inte klar, rullar tillbaka"
          kubectl get pods -l app=saldes
          kubectl rollout undo deployment/saldes
          kubectl rollout status deployment/saldes --timeout=180s
          exit 1
        fi

    - name: Kontrollera att tjänsten svarar
      shell: bash
      run: |
        kubectl port-forward service/saldes 8080:80 &
        trap 'kill $!' EXIT
        curl --fail --retry 10 --retry-all-errors --retry-delay 2 http://localhost:8080/health
